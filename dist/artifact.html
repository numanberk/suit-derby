<title>Suit Derby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Suit Derby. One committed dark look: a night track under floodlights.
   Layout: a single column of screens; the race screen is deliberately sparse. */
:root {
  color-scheme: dark;
  --ground: #0d110c;
  --track: #161c14;
  --raise: #1e271b;
  --line: #2b3628;
  --ink: #ece8da;
  --ink-dim: #9ba593;
  --gold: #e9cf73;
  --gold-ink: #1b1607;
  --good: #66d394;
  --bad: #f07272;
  --hearts: #f0525e;
  --diamonds: #ff9a3d;
  --clubs: #3fc48a;
  --spades: #8092ff;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --hw: 72px;
  --bibw: 48px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.5 var(--f-body); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.app { max-width: 960px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 56px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.s0 { --c: var(--hearts); }
.s1 { --c: var(--diamonds); }
.s2 { --c: var(--clubs); }
.s3 { --c: var(--spades); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.gold { color: var(--gold); }
.dim { color: var(--ink-dim); }
/* shared bits */
.btn { font: 700 15px var(--f-body); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 24px; }
.lbl { font: 500 11px var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; }
.lede { color: var(--ink-dim); font-size: 17px; max-width: 52ch; }
.lede.sm { font-size: 15px; margin-bottom: 20px; }
.note { color: var(--ink-dim); font-size: 14px; margin-top: 18px; max-width: 65ch; }
.bar { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.bar h2 { font: 800 32px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; flex: 1; min-width: 0; }
.backbtn { background: none; border: 0; color: var(--ink-dim); padding: 6px 0; font: 600 14px var(--f-body); }
.backbtn:hover { color: var(--ink); }
.cashchip { font: 800 26px/1 var(--f-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.cashchip.sp { color: var(--ink); }
/* menu */
.sndbtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--track); color: var(--ink); }
.sndbtn[aria-pressed="false"] { color: var(--ink-dim); }
.sndbtn:hover { border-color: var(--ink-dim); }
.langrow .sndbtn { margin-right: 0; }
.langrow #sndMenu { margin-left: 0; }
.langrow .langlbl { margin-left: auto; }
.langrow { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 14px; }
.langlbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
.langsw { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--track); }
.langsw button { font: 700 13px var(--f-body, inherit); padding: 7px 14px; border-radius: 999px; color: var(--ink-dim); min-height: 34px; }
.langsw button:hover { color: var(--ink); }
.langsw button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.menu-hero h1 { font: 900 clamp(56px, 13vw, 104px)/0.86 var(--f-display); text-transform: uppercase; letter-spacing: 0.015em; }
.menu-hero .lede { margin-top: 14px; }
.lineup { display: flex; gap: 8px; margin: 30px 0 26px; flex-wrap: wrap; }
.lineup .lu { width: 88px; }
.lineup .lu .horse { display: block; width: 100%; height: auto; }
.menu-list { display: grid; gap: 10px; max-width: 520px; }
.mrow { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--track); }
.mrow:hover { border-color: var(--ink-dim); }
.mrow .mt { font: 800 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; }
.mrow .md { color: var(--ink-dim); font-size: 14px; }
.mrow.primary { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.mrow.primary .md { color: rgba(27, 22, 7, 0.75); }
.mstats { margin-top: 22px; font-size: 12px; color: var(--ink-dim); }
/* setup */
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
@media (max-width: 560px) {
  .picks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.pick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 6px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--track); cursor: pointer; }
.pick input, .pill input { position: absolute; opacity: 0; pointer-events: none; }
.pick .g { font: 700 44px/1 var(--f-body); color: var(--c); }
.pick .n { font: 800 18px var(--f-display); text-transform: uppercase; letter-spacing: 0.06em; }
.pick:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--track)); box-shadow: 0 0 0 1px var(--c) inset; }
.pick:has(input:focus-visible), .pill:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
.pills { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { position: relative; display: flex; flex-direction: column; gap: 0; padding: 12px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--track); cursor: pointer; min-width: 150px; }
.pill b { font: 800 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; }
.pill span { color: var(--ink-dim); font-size: 13px; }
.pill:has(input:checked) { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.pill:has(input:checked) span { color: #3b4636; }
/* game */
.gbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-bottom: 12px; }
.horse { display: block; width: 100%; height: auto; overflow: visible; position: relative; }
.horse .fill { fill: var(--c); }
.horse .leg { fill: none; stroke: var(--c); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; animation: stride var(--gp, 1.2s) linear infinite; }
.horse .leg.far { stroke: color-mix(in srgb, var(--c) 55%, #000); }
.horse .leg.bn { animation-delay: calc(var(--gp, 1.2s) * -0.5); }
.horse .leg.fn { animation-delay: calc(var(--gp, 1.2s) * -0.25); }
.horse .leg.bf { animation-delay: calc(var(--gp, 1.2s) * -0.75); }
.horse .bob { animation: bob var(--gp, 1.2s) ease-in-out infinite; }
.lu .leg, .lu .bob { animation: none; }
.horse .ink { fill: var(--ink); }
@keyframes stride { 0% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } 100% { transform: rotate(-28deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
.card { width: 64px; height: 90px; perspective: 600px; flex: none; }
.face, .back { position: absolute; inset: 0; border-radius: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face { background: #10150f; border: 2px solid var(--c, var(--line)); color: var(--ink); }
.face .br { right: 5px; bottom: 4px; transform: rotate(180deg); }
.back { transform: rotateY(180deg); background-color: #12261b; border: 2px solid #2f4d3a; background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.07) 0 4px, transparent 4px 8px), repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.07) 0 4px, transparent 4px 8px); }
.chip { font: 700 11px var(--f-mono); padding: 2px 5px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--c); flex: none; }
.stmt .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.stmt .row span:first-child { color: var(--ink-dim); }
.stmt .row b { font: 700 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.stmt .row.total { border-top: 2px solid var(--ink); padding-top: 10px; }
.stmt .row.total span:first-child { color: var(--ink); font: 800 18px var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; }
.stmt .row.total b { font: 900 26px/1 var(--f-display); }
.offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.offer { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; background: var(--track); border: 1px solid var(--line); min-width: 0; }
.offer.sold { opacity: 0.5; }
.own { font: 500 11px var(--f-mono); color: var(--ink-dim); }
.offer h4 { margin: 0; font: 800 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; }
.offer p { color: var(--ink-dim); font-size: 14px; flex: 1; }
.price { font: 800 22px/1 var(--f-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.price.short { color: var(--bad); }
.pips { display: flex; gap: 5px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.pips i.on { background: var(--gold); }
/* rules */
.rules { display: grid; gap: 26px; max-width: 68ch; }
.rules section h3 { font: 800 24px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.rules section p { color: var(--ink-dim); }
.rules section p + p { margin-top: 8px; }
.rules b { color: var(--ink); font-weight: 600; }
@media (max-width: 720px) {
  :root { --hw: 56px; --bibw: 40px; }
  .gbar { grid-template-columns: auto minmax(0, 1fr) auto; }
  .spur { min-height: 44px; flex: 1 0 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .horse .leg, .horse .bob { animation: none; }
}
/* ---- tiers ---- */
:root { --t-common: #a4ae9c; --t-rare: #5ab0ff; --t-epic: #c084fc; --t-legendary: #ffc94d; }
.t-common { --tc: var(--t-common); }
.t-rare { --tc: var(--t-rare); }
.t-epic { --tc: var(--t-epic); }
.t-legendary { --tc: var(--t-legendary); }
.offer { border-color: color-mix(in srgb, var(--tc, var(--line)) 50%, var(--line)); }
.offer.t-epic { box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 35%, transparent) inset; }
.offer.t-legendary { border-color: var(--tc); box-shadow: 0 0 0 1px var(--tc) inset, 0 0 26px -10px var(--tc); background: color-mix(in srgb, var(--tc) 7%, var(--track)); }
.offer .kindlbl { font: 500 11px var(--f-mono); color: var(--ink-dim); }
.board { display: grid; gap: 6px; }
.table { display: flex; gap: 18px 24px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--track); }
.mc { width: 52px; height: 72px; border-radius: 7px; border: 2px solid var(--c, var(--line)); background: #10150f; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.mc b { font: 800 20px/1 var(--f-display); }
.mc i { font: 700 16px/1 var(--f-body); font-style: normal; color: var(--c); }
.mc.q { background-color: #12261b; border-color: #2f4d3a; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 4px, transparent 4px 8px), repeating-linear-gradient(-45deg, rgba(255,255,255,.07) 0 4px, transparent 4px 8px); }
/* ---- race screen: calls ---- */
.calls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
.calls span { padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-dim); }
.calls span b { color: var(--c); }
.calls .hit { border-color: var(--good); color: var(--good); }
.calls .miss { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.face.chaosface { border-color: var(--gold); }
/* choosing yourself */
.pick { padding-top: 20px; transition: transform .12s; }
.pick .you { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: 999px; background: var(--c); color: #0b0f0c; font: 800 11px var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0; }
.pick:has(input:checked) { transform: translateY(-2px); border-width: 2px; box-shadow: 0 0 0 1px var(--c) inset, 0 6px 22px color-mix(in srgb, var(--c) 35%, transparent); }
.pick:has(input:checked) .you { opacity: 1; }
.pick:not(:has(input:checked)) { opacity: 0.72; }
.btn.act { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 68px; padding: 10px; }
.streak { font-size: 12px; color: var(--ink-dim); }
.streak.on { color: var(--gold); text-shadow: 0 0 12px rgba(233, 207, 115, 0.8); }
.bets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stakes { display: flex; gap: 6px; }
.calls { margin-top: 14px; }
/* ===== win effects ===== */
#flashfx { position: fixed; inset: 0; pointer-events: none; z-index: 65; opacity: 0; background: radial-gradient(circle at 50% 45%, var(--fc, #ffe07a), transparent 65%); }
#flashfx.on { animation: flashA 0.55s ease-out; }
.bigwin { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; z-index: 70; opacity: 0; }
.bigwin.on { opacity: 1; animation: bwIn 0.55s cubic-bezier(0.2, 1.5, 0.3, 1); }
.bw-rays { position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; background: repeating-conic-gradient(rgba(255, 217, 90, 0.2) 0 6deg, transparent 6deg 16deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 38%); mask-image: radial-gradient(circle, #000 0, transparent 38%); animation: spin 9s linear infinite; }
.bw-t { position: relative; font: 900 clamp(56px, 15vw, 130px)/0.92 var(--f-display); letter-spacing: 0.05em; background: linear-gradient(180deg, #fff8c8, #ffd54a 55%, #e0861a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #8a4f12) drop-shadow(0 0 26px rgba(255, 200, 60, 0.75)); }
.bw-a { position: relative; font: 800 clamp(34px, 9vw, 72px)/1.1 var(--f-mono); color: #fff; text-shadow: 0 0 18px rgba(255, 224, 122, 0.9), 0 3px 0 rgba(0, 0, 0, 0.5); margin-top: 6px; }
.bigwin.t-mega .bw-t { font-size: clamp(64px, 18vw, 160px); filter: drop-shadow(0 5px 0 #7a1f2a) drop-shadow(0 0 30px rgba(255, 90, 120, 0.8)); background: linear-gradient(180deg, #fff2c4, #ff9f43 50%, #e0304a); -webkit-background-clip: text; background-clip: text; }
.bigwin.t-jackpot .bw-t { font-size: clamp(64px, 18vw, 160px); animation: hueRoll 1.2s linear infinite; }
.bigwin.t-jackpot .bw-rays { animation-duration: 4s; }
.shake1 { animation: shk1 0.45s; }
.shake2 { animation: shk2 0.55s; }
.shake3 { animation: shk3 0.65s; }
.row.pop { animation: rowpop 0.6s both; }
@keyframes bwIn { from { transform: scale(0.3) rotate(-4deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flashA { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes hueRoll { from { filter: hue-rotate(0deg) drop-shadow(0 5px 0 #8a4f12) drop-shadow(0 0 26px rgba(255, 200, 60, 0.75)); } to { filter: hue-rotate(360deg) drop-shadow(0 5px 0 #8a4f12) drop-shadow(0 0 26px rgba(255, 200, 60, 0.75)); } }
@keyframes shk1 { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, -1px); } 80% { transform: translate(2px, 2px); } }
@keyframes shk2 { 0%, 100% { transform: translate(0, 0); } 15% { transform: translate(-6px, 3px); } 30% { transform: translate(6px, -4px); } 45% { transform: translate(-5px, -3px); } 60% { transform: translate(5px, 4px); } 80% { transform: translate(-3px, 1px); } }
@keyframes shk3 { 0%, 100% { transform: translate(0, 0); } 12% { transform: translate(-10px, 5px); } 25% { transform: translate(10px, -6px); } 38% { transform: translate(-9px, -5px); } 50% { transform: translate(9px, 6px); } 65% { transform: translate(-6px, 3px); } 80% { transform: translate(4px, -2px); } }
@keyframes rowpop { 0% { transform: scale(0.96); background: rgba(233, 207, 115, 0.35); } 100% { transform: scale(1); background: transparent; } }
@media (prefers-reduced-motion: reduce) {
  .shake1, .shake2, .shake3, .bw-rays, .bigwin.on { animation: none; }
}
@media (max-width: 560px) {
  .btn.act { padding: 8px 4px; }
}
.mrow.daily { border-color: #6b5d20; }
.mrow.resume { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--track)); }
.mrow.resume .mt { color: var(--good); }
.note.warn { color: var(--gold); }
.mrow.daily .mt { color: var(--gold); }
.pill:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
.sect-h { margin-top: 30px; }
.actions.top { margin-top: 0; margin-bottom: 16px; }
.modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 9, 6, 0.82); }
.mcard { width: min(100%, 440px); max-height: 92vh; overflow: auto; padding: 22px 20px 16px; border-radius: 16px; border: 1px solid var(--gold); background: var(--track); }
.mcard h3 { font: 900 34px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; color: var(--gold); }
.mcard p { color: var(--ink); margin-bottom: 8px; }
.mcard p small { color: var(--ink-dim); font-size: 13px; }
.mdots { display: flex; gap: 6px; margin-bottom: 14px; }
.mdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.mdots i.on { background: var(--gold); }
.mnav { display: flex; justify-content: space-between; margin-top: 14px; }
.mglyph { font-size: 38px; letter-spacing: 6px; margin-bottom: 6px; }
.sp { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--track); font: 600 13px var(--f-body); }
.sp i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
.sp.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.sp:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 44px; border-radius: 10px; }
.btn.ab.gad { border-color: color-mix(in srgb, #8fb8ee 60%, var(--line)); background: color-mix(in srgb, #8fb8ee 9%, var(--raise)); }
.btn.ab.crd { border-color: color-mix(in srgb, #c79bf0 60%, var(--line)); background: color-mix(in srgb, #c79bf0 9%, var(--raise)); }
.btn.ab.armed { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 16px -4px var(--gold); }
.btn.ab:disabled { opacity: 0.45; }
.wheel { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
/* ===== v11: the Stable skill tree ===== */
.treewrap { overflow: auto; max-height: 76vh; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(circle at 50% 50%, #18211a, var(--ground) 70%); touch-action: pan-x pan-y; }
#gtree { display: block; width: max(100%, 780px); height: auto; }
#gtree .ring { fill: none; stroke: rgba(255,255,255,.05); stroke-dasharray: 3 7; }
#gtree .edge { stroke: rgba(255,255,255,.12); stroke-width: 3; }
#gtree .edge.on { stroke: var(--c); stroke-width: 4; opacity: .9; }
#gtree .nd { cursor: pointer; }
#gtree .nd circle { fill: #141b13; stroke: color-mix(in srgb, var(--c, #888) 35%, #333); stroke-width: 3; transition: fill .15s, stroke .15s; }
#gtree .nd .ic { font-size: 24px; pointer-events: none; }
#gtree .nd.st-locked { opacity: .38; }
#gtree .nd.st-open circle { stroke: color-mix(in srgb, var(--c) 70%, #555); stroke-dasharray: 5 4; }
#gtree .nd.st-aff circle { stroke: var(--c); stroke-width: 4; fill: color-mix(in srgb, var(--c) 18%, #141b13); animation: ndpulse 1.6s ease-in-out infinite; }
#gtree .nd.st-own circle, #gtree .nd.st-max circle { fill: color-mix(in srgb, var(--c) 40%, #141b13); stroke: var(--c); stroke-width: 4; }
#gtree .nd.st-max circle { fill: color-mix(in srgb, var(--c) 65%, #141b13); }

<script>
/* Suit Derby translations. English text is the key: t('Lap {n}', {n: 3}) returns the English
   text as written, or the Turkish one from I18n.dict.tr when that language is selected.
   A missing translation falls back to English, so nothing ever shows up blank.
   The choice is stored in localStorage (wrapped in try/catch: the game works without storage). */
const I18n = (() => {
  const KEY = 'suitderby.lang';
  const LANGS = [{ id: 'en', name: 'English', short: 'EN', html: 'en' }, { id: 'tr', name: 'Türkçe', short: 'TR', html: 'tr' }];
  const dict = { en: {}, tr: {} };
  const rules = { en: null, tr: null };
  const listeners = [];
  let lang = 'en';

  function detect() {
    try { const v = localStorage.getItem(KEY); if (v && dict[v]) return v; } catch (e) {}
    try { if (/^tr\b/i.test(navigator.language || '')) return 'tr'; } catch (e) {}
    return 'en';
  }
  function fill(s, p) {
    if (!p) return s;
    return s.replace(/\{(\w+)\}/g, (m, k) => (p[k] != null ? p[k] : m));
  }
  function t(en, p) {
    const d = dict[lang];
    const s = d && Object.prototype.hasOwnProperty.call(d, en) ? d[en] : en;
    return fill(s, p);
  }
  /* plural helper: one/other are both English keys; Turkish usually has the same text for both */
  const tp = (n, one, other, p) => t(n === 1 ? one : other, Object.assign({ n }, p));
  /* decimal comma in Turkish: n(2.5.toFixed(1)) -> "2,5" */
  const n = s => (lang === 'tr' ? String(s).replace('.', ',') : String(s));
  const locale = () => (lang === 'tr' ? 'tr-TR' : 'en-US');

  function applyStatic(root) {
    root = root || document;
    root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    root.querySelectorAll('[data-i18n-label]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-label'))); });
    root.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
    if (root === document) {
      document.documentElement.lang = lang;
      const ti = document.querySelector('title'); if (ti) ti.textContent = t('Suit Derby');
    }
  }
  function set(id, silent) {
    if (!dict[id]) id = 'en';
    lang = id;
    if (!silent) { try { localStorage.setItem(KEY, id); } catch (e) {} }
    applyStatic();
    listeners.forEach(f => f(id));
  }
  function init() { lang = detect(); applyStatic(); }
  return {
    t, tp, n, locale, set, init, LANGS, dict, rules,
    get lang() { return lang; },
    onChange: f => { listeners.push(f); },
    apply: applyStatic
  };
})();
if (typeof module !== 'undefined') module.exports = I18n;

</script>

    "Suit Derby": "Suit Derby",
    "Menu": "Menü",
    "Permanent upgrades": "Kalıcı geliştirmeler",

<script>
/* Suit Derby sound. Everything is synthesized with WebAudio (no files to load).
   Design rules that make it feel good:
   - every card is a soft mallet note on a pentatonic scale, so the race plays a little tune;
   - a hit streak climbs the scale, so winning streaks literally rise in pitch;
   - wins scale up: coin ping, coin shower, brass fanfare, jackpot siren;
   - misses are a soft low blip, never a harsh buzz;
   - a quiet crowd and a galloping hoofbeat sit under the race and swell when something happens.
   Sound starts after the first tap (browser rule), is saved as on/off, and can never break the game. */
const Sfx = (() => {
  const KEY = 'suitderby.snd';
  const SC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];   // C major pentatonic
  const SUIT_NOTE = [0, 2, 3, 4];          // hearts C, diamonds E, clubs G, spades A
  let ctx = null, bus = null, comp = null, master = null, noiseBuf = null, on = true, offline = false;
  const listeners = [];
  const KEY_M = 'suitderby.mus', MUS = 0.4;
  let mon = true, musBus = null, musOut = null;
  try { mon = localStorage.getItem(KEY_M) !== '0'; } catch (e) {}
  try { on = localStorage.getItem(KEY) !== '0'; } catch (e) {}

  function init() {
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = on ? 0.9 : 0;
    bus = ctx.createGain(); bus.gain.value = 1.5;
    bus.connect(comp); comp.connect(master); master.connect(ctx.destination);
    // music has its own bus, a gentle compressor and its own on/off
    musBus = ctx.createGain(); musBus.gain.value = 0.0001;
    const mc = ctx.createDynamicsCompressor();
    mc.threshold.value = -20; mc.knee.value = 14; mc.ratio.value = 3; mc.attack.value = 0.01; mc.release.value = 0.25;
    musOut = ctx.createGain(); musOut.gain.value = mon ? 1 : 0;
    musBus.connect(mc); mc.connect(musOut); musOut.connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 2);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function go() { return on ? ctxGo() : null; }
  function ctxGo() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); init(); } catch (e) { ctx = null; return null; }
    }
    if (!offline && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  /* wraps a sound so a failure in audio never reaches the game */
  const S = fn => function () { if (!go()) return; try { fn.apply(null, arguments); } catch (e) {} };

  /* ---------- building blocks ---------- */
  function tone(o) {
    const t0 = ctx.currentTime + (o.at || 0), dur = o.dur || 0.2, vol = o.vol || 0.15, atk = o.atk || 0.004;
    const os = ctx.createOscillator(), g = ctx.createGain();
    os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.f, t0);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    if (o.det) os.detune.value = o.det;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); f.connect(g); } else os.connect(g);
    g.connect(o.dest || bus);
    os.start(t0); os.stop(t0 + dur + 0.05);
  }
  function noise(o) {
    const t0 = ctx.currentTime + (o.at || 0), dur = o.dur || 0.1, vol = o.vol || 0.1;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(o.dest || bus);
    s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.05);
  }
  /* a mallet / coin ping: a sine plus a short bright overtone */
  function ping(f, vol, at, dur) {
    dur = dur || 0.35;
    tone({ f, dur, vol, at, atk: 0.003 });
    tone({ f: f * 2.76, dur: dur * 0.35, vol: vol * 0.3, at, atk: 0.002 });
  }
  function brass(f, at, dur, vol) {
    tone({ f, at, dur, vol: vol * 0.55, type: 'sawtooth', lp: 1700, atk: 0.03 });
    tone({ f: f * 1.006, at, dur, vol: vol * 0.45, type: 'sawtooth', lp: 1500, atk: 0.035 });
    tone({ f: f / 2, at, dur, vol: vol * 0.5, type: 'triangle', atk: 0.03 });
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  /* ---------- interface ---------- */
  const click = S(() => { tone({ f: 900, to: 620, dur: 0.045, type: 'triangle', vol: 0.11 }); });
  const pick = S(() => { ping(SC[4], 0.12, 0, 0.14); });
  const chip = S(() => {
    noise({ type: 'bandpass', f: 5200, q: 2, dur: 0.025, vol: 0.12 });
    tone({ f: 2500, dur: 0.03, vol: 0.05 });
    noise({ type: 'bandpass', f: 4600, q: 2, dur: 0.025, vol: 0.1, at: 0.04 });
    tone({ f: 2100, dur: 0.03, vol: 0.045, at: 0.04 });
  });
  const shuffle = S(() => { for (let i = 0; i < 7; i++) noise({ type: 'bandpass', f: rnd(2200, 4200), q: 1.2, dur: 0.045, vol: 0.09, at: i * 0.045 }); });
  const flip = S(() => { noise({ type: 'bandpass', f: 2600, to: 4200, q: 0.8, dur: 0.06, vol: 0.1 }); tone({ f: 180, to: 120, dur: 0.05, vol: 0.06 }); });
  const buy = S(() => {          // cha-ching
    noise({ type: 'highpass', f: 6000, dur: 0.05, vol: 0.1 });
    tone({ f: 210, to: 120, dur: 0.09, vol: 0.12 });
    ping(SC[7], 0.13, 0.03, 0.45);
    ping(SC[9], 0.11, 0.11, 0.55);
  });
  const deny = S(() => { tone({ f: 200, to: 150, dur: 0.1, type: 'triangle', vol: 0.11 }); });

  /* ---------- the race ---------- */
  const count = S(n => {
    if (n === 'GO') {
      [0, 2, 4].forEach((k, i) => ping(SC[k] * 2, 0.12, i * 0.02, 0.5));
      tone({ f: 130, to: 65, dur: 0.3, vol: 0.2 });
      noise({ type: 'bandpass', f: 700, to: 3000, q: 0.7, dur: 0.35, vol: 0.09 });
    } else { tone({ f: 660, dur: 0.16, vol: 0.12, type: 'triangle' }); ping(SC[0], 0.06, 0, 0.2); }
  });
  /* every card is a note; your own suit is louder and higher cards ring a little more */
  const draw = S((suit, mine, rank) => {
    flip();
    const f = SC[SUIT_NOTE[suit] || 0] * (mine ? 1 : 0.5);
    ping(f, (mine ? 0.12 : 0.055) * (0.75 + (rank || 8) / 14 * 0.5), 0.02, mine ? 0.45 : 0.3);
  });
  const chaos = S(() => {
    tone({ f: 180, to: 900, dur: 0.35, type: 'square', vol: 0.05, lp: 1800 });
    for (let i = 0; i < 6; i++) ping(rnd(900, 2200), 0.05, 0.05 + i * 0.05, 0.25);
  });
  const surge = S(() => { noise({ type: 'bandpass', f: 400, to: 1700, q: 0.8, dur: 0.22, vol: 0.16 }); });
  const spur = S((pct, mine) => {
    const p = Math.max(0.15, Math.min(1, pct / 100)), v = mine ? 1 : 0.35;
    noise({ type: 'bandpass', f: 300, to: 2400 + 2400 * p, q: 0.7, dur: 0.3 + 0.3 * p, vol: (0.09 + 0.1 * p) * v });
    tone({ f: 120, to: 420 + 700 * p, dur: 0.35 + 0.15 * p, type: 'sawtooth', lp: 1300, vol: 0.05 * v });
    tone({ f: 75, to: 38, dur: 0.3, vol: (0.12 + 0.2 * p) * v });
    if (mine && p > 0.97) [4, 5, 7, 9].forEach((k, i) => ping(SC[k], 0.07, 0.12 + i * 0.05, 0.3));
  });
  const warn = S(() => { tone({ f: 740, dur: 0.08, type: 'triangle', vol: 0.11 }); tone({ f: 740, dur: 0.08, type: 'triangle', vol: 0.11, at: 0.11 }); });
  const perfect = S(() => {
    ping(SC[5], 0.14, 0, 0.4); ping(SC[7], 0.13, 0.06, 0.5); ping(SC[9], 0.1, 0.12, 0.6);
    noise({ type: 'highpass', f: 7000, dur: 0.25, vol: 0.06, at: 0.05 });
  });
  const clear = S(() => { tone({ f: 480, to: 760, dur: 0.11, vol: 0.11, type: 'triangle' }); noise({ type: 'bandpass', f: 1500, q: 0.6, dur: 0.12, vol: 0.08 }); });
  const stumble = S(mine => {
    const v = mine ? 1 : 0.4;
    tone({ f: 230, to: 70, dur: 0.45, type: 'sawtooth', lp: 650, vol: 0.12 * v });
    tone({ f: 340, to: 165, dur: 0.4, type: 'triangle', vol: 0.08 * v, at: 0.04 });
    noise({ type: 'lowpass', f: 420, dur: 0.16, vol: 0.18 * v });
  });
  const trap = S(() => {            // a ratchet, then a snap: the trap is set
    for (let i = 0; i < 4; i++) noise({ type: 'bandpass', f: 2400 + i * 300, q: 4, dur: 0.02, vol: 0.14, at: i * 0.045 });
    tone({ f: 150, to: 60, dur: 0.14, type: 'square', lp: 700, vol: 0.12, at: 0.2 }); noise({ type: 'highpass', f: 5000, dur: 0.05, vol: 0.12, at: 0.2 });
  });
  const trapHit = S(() => {         // gotcha
    noise({ type: 'highpass', f: 4500, dur: 0.06, vol: 0.2 }); tone({ f: 120, to: 50, dur: 0.22, type: 'sawtooth', lp: 600, vol: 0.14 });
    ping(SC[6], 0.1, 0.1, 0.35); ping(SC[8], 0.09, 0.17, 0.45);
  });
  const peek = S(() => {            // a quick glance: soft shimmer
    noise({ type: 'bandpass', f: 3000, to: 6000, q: 1, dur: 0.16, vol: 0.07 }); ping(SC[7], 0.09, 0.05, 0.3); ping(SC[9], 0.07, 0.12, 0.35);
  });
  const burn = S(() => {            // whoosh and a low thud: the card is gone
    noise({ type: 'bandpass', f: 2500, to: 350, q: 0.7, dur: 0.34, vol: 0.16 }); tone({ f: 170, to: 55, dur: 0.3, type: 'triangle', vol: 0.14, at: 0.04 });
  });

  /* ---------- the crowd and the hoofbeats under the race ---------- */

  /* ---------- music ----------
     Two generated tracks, both loops of four bars.
     chill: the menu, setup, pit stop and results. Warm keys, a soft beat, a little hook that comes in on the second pass.
     race:  driving pulse. It starts with kick, bass and hats, then adds a plucked arpeggio, a clap, a pad and a lead hook
            as the lap goes on, and gets busier in the last stretch. */
  let mWant = null, mMode = null, mLevel = 0, mDim = 1, mSwell = 1, mStep = 0, mNext = 0, mTimer = null;
  const mt = o => tone(Object.assign({ dest: musBus }, o));

  const hat = (at, v, open) => mn({ type: 'highpass', f: 8500, dur: open ? 0.09 : 0.035, vol: 0.06 * v, at });
  const clap = (at, v) => [0, 0.012, 0.024].forEach(d => mn({ type: 'bandpass', f: 1600, q: 0.9, dur: 0.06, vol: 0.1 * v, at: at + d }));
  const bass = (f, at, dur, v) => { mt({ f, dur, vol: 0.32 * v, at, type: 'triangle', lp: 520, atk: 0.005 }); mt({ f, dur: dur * 0.8, vol: 0.16 * v, at, atk: 0.005 }); };
  const ep = (f, at, v, dur) => { dur = dur || 0.9; mt({ f, dur, vol: 0.085 * v, at, atk: 0.004 }); mt({ f: f * 2, dur: dur * 0.5, vol: 0.03 * v, at }); mt({ f: f * 4.02, dur: 0.12, vol: 0.02 * v, at }); };
  const pluck = (f, at, v) => mt({ f, dur: 0.13, vol: 0.065 * v, at, type: 'triangle', lp: 2800, atk: 0.002 });
  const lead = (f, at, v) => { mt({ f, dur: 0.24, vol: 0.05 * v, at, type: 'square', lp: 2300, atk: 0.005 }); mt({ f: f * 1.005, dur: 0.24, vol: 0.03 * v, at, type: 'sawtooth', lp: 2000, atk: 0.005 }); };

    [880, 0, 0, 659.25, 0, 0, 523.25, 0, 659.25, 0, 0, 0, 587.33, 0, 523.25, 0],
    [523.25, 0, 0, 587.33, 0, 0, 523.25, 0, 440, 0, 0, 0, 523.25, 0, 0, 0],
    [659.25, 0, 0, 783.99, 0, 0, 659.25, 0, 587.33, 0, 523.25, 0, 587.33, 0, 659.25, 0],
    [587.33, 0, 0, 659.25, 0, 587.33, 0, 0, 523.25, 0, 0, 0, 587.33, 0, 0, 0]

    [[0, 659.25], [3, 783.99], [6, 880], [10, 783.99]],
    [[0, 880], [4, 783.99], [8, 659.25], [12, 523.25]],
    [[0, 587.33], [3, 659.25], [7, 880], [10, 783.99]],
    [[0, 783.99], [6, 659.25], [8, 587.33], [12, 659.25]]

    swell(v) { v = Math.round(v * 20) / 20; if (v !== mSwell) { mSwell = v; if (ctx && mMode) mGain(1, 0.3); } },
    dim(v) { if (v !== mDim) { mDim = v; if (ctx && mMode) mGain(1, 0.12); } },

  /* test hook: render a sound offline and report its level (used by the build checks) */
  async function render(name, args, secs) {

    const keep = { ctx, bus, comp, master, noiseBuf, offline, on };
    ctx = oc; offline = true; on = true; init();
    try { api[name].apply(null, args || []); const buf = await oc.startRendering(); return buf.getChannelData(0); }
    finally { ({ ctx, bus, comp, master, noiseBuf, offline, on } = keep); }
  }

<script>
/* Suit Derby win effects: the classic casino pop. Coins, confetti, sparks, shockwaves,
   a BIG WIN banner with a counting number, and a screen shake. All of it draws on one
   transparent canvas over the page and stops when there is nothing left to draw. */
const FX = (() => {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.createElement('canvas');
  cv.id = 'fx'; cv.setAttribute('aria-hidden', 'true');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, parts = [], running = false, last = 0;
  const COL = ['#f0525e', '#ff9a3d', '#3fc48a', '#8092ff', '#e9cf73', '#ece8da'];
  const rand = (a, b) => a + Math.random() * (b - a);

  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', size); size();

  function start() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life || p.y > H + 40) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.k === 'coin' && p.y > p.floor && p.vy > 0 && p.bounce > 0) { p.y = p.floor; p.vy *= -0.45; p.bounce--; p.vx *= 0.7; }
      const f = p.age / p.life, a = f > 0.75 ? 1 - (f - 0.75) / 0.25 : 1;
      ctx.globalAlpha = Math.max(0, a);
      if (p.k === 'coin') {
        const squash = Math.abs(Math.cos(p.rot * 2));
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * 0.3);
        ctx.fillStyle = '#c99a1c'; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * (0.25 + 0.75 * squash), 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd95a'; ctx.beginPath(); ctx.ellipse(0, -0.6, p.s * 0.82, p.s * (0.22 + 0.68 * squash), 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(-p.s * 0.3, -p.s * 0.35 * squash, p.s * 0.22, p.s * 0.5 * squash);
        ctx.restore();
      } else if (p.k === 'conf') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 1.7));
        ctx.fillStyle = p.c; ctx.fillRect(-p.s, -p.s * 0.5, p.s * 2, p.s); ctx.restore();
      } else if (p.k === 'spark') {
        ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.s / 2, -p.s * 2, p.s, p.s * 4); ctx.fillRect(-p.s * 2, -p.s / 2, p.s * 4, p.s); ctx.restore();
      } else if (p.k === 'ring') {
        ctx.strokeStyle = p.c; ctx.lineWidth = 4 * (1 - f) + 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s + f * p.grow, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  const add = p => { parts.push(Object.assign({ age: 0, life: 1.2, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, s: 4, c: '#fff', floor: 1e9, bounce: 0 }, p)); };

  function coins(x, y, n, o) {
    if (reduce) return;
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), v = rand(220, 560) * (o.power || 1);
      add({ k: 'coin', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 1100, s: rand(6, 10), rot: rand(0, 6), vr: rand(-14, 14), life: rand(1.3, 2.1), floor: y + rand(90, 200), bounce: 2 });
    }
    start();
  }
  function confetti(x, y, n, o) {
    if (reduce) return;
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = o.rain ? Math.PI / 2 + rand(-0.4, 0.4) : rand(-Math.PI * 0.95, -Math.PI * 0.05), v = o.rain ? rand(40, 160) : rand(180, 620);
      add({ k: 'conf', x: o.rain ? rand(0, W) : x, y: o.rain ? rand(-60, -5) : y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: o.rain ? 220 : 620, s: rand(3, 6), rot: rand(0, 6), vr: rand(-9, 9), life: rand(1.6, 2.8), c: COL[Math.floor(Math.random() * COL.length)] });
    }
    start();
  }
  function sparks(x, y, n, color) {
    if (reduce) return;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(80, 320);
      add({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 300, s: rand(1.5, 3), rot: rand(0, 3), vr: rand(-6, 6), life: rand(0.5, 1), c: color || '#ffe07a' });
    }
    start();
  }
  function ring(x, y, color) {
    if (reduce) return;
    add({ k: 'ring', x, y, s: 10, grow: 150, life: 0.6, c: color || '#ffd95a' });
    add({ k: 'ring', x, y, s: 4, grow: 90, life: 0.45, c: '#fff' });
    start();
  }
  function shake(level) {
    if (reduce) return;
    const app = document.querySelector('.app');
    if (!app) return;
    app.classList.remove('shake1', 'shake2', 'shake3');
    void app.offsetWidth;
    app.classList.add('shake' + level);
    setTimeout(() => app.classList.remove('shake1', 'shake2', 'shake3'), 620);
  }
  function flash(color) {
    const f = document.getElementById('flashfx');
    if (!f || reduce) return;
    f.style.setProperty('--fc', color || '#ffe07a');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  }
  function countUp(el, to, dur, prefix, sign) {
    const fmt = v => (v < 0 ? '−' : sign && v > 0 ? '+' : '') + prefix + Math.abs(Math.round(v)).toLocaleString(I18n.locale());
    if (reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    (function step(now) {
      const f = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - f, 3);
      el.textContent = fmt(to * e);
      if (f < 1) requestAnimationFrame(step);
    })(t0);
  }
  let bannerTimer = 0;
  function banner(title, amount, tier) {
    const b = document.getElementById('bigwin');
    if (!b) return;
    b.className = 'bigwin t-' + (tier || 'big');
    b.querySelector('.bw-t').textContent = title;
    const amt = b.querySelector('.bw-a');
    amt.textContent = '';
    b.hidden = false;
    void b.offsetWidth;
    b.classList.add('on');
    if (amount != null) countUp(amt, amount, tier === 'mega' || tier === 'jackpot' ? 1300 : 900, '$', true);
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { b.classList.remove('on'); setTimeout(() => { b.hidden = true; }, 350); }, tier === 'mega' || tier === 'jackpot' ? 2600 : 1900);
  }

  /* one call for "you won this much": scales the show with the size of the win */
  function win(amount, x, y, title) {
    if (amount <= 0) return;
    if (x == null) { x = W / 2; y = H * 0.45; }
    const tier = amount >= 150 ? 'jackpot' : amount >= 90 ? 'mega' : amount >= 40 ? 'big' : 'nice';
    Sfx.win(tier);
    coins(x, y, tier === 'nice' ? 10 : tier === 'big' ? 26 : tier === 'mega' ? 44 : 70);
    sparks(x, y, tier === 'nice' ? 10 : 24);
    ring(x, y, tier === 'nice' ? '#ffe07a' : '#ffd95a');
    if (tier !== 'nice') { confetti(x, y, tier === 'big' ? 40 : 90); shake(tier === 'big' ? 1 : tier === 'mega' ? 2 : 3); flash(); }
    if (tier === 'jackpot') confetti(0, 0, 120, { rain: true });
    if (tier !== 'nice') banner(title || I18n.t(tier === 'big' ? 'BIG WIN' : tier === 'mega' ? 'MEGA WIN' : 'JACKPOT'), amount, tier);
    return tier;
  }
  return { coins, confetti, sparks, ring, shake, flash, banner, countUp, win, size };
})();

</script>

      sec('The deck', [T('Every race has its own shuffled deck, and drawn cards are never put back. Each suit holds 8 to 11 plain cards and up to 3 face cards, so some decks are very lopsided. The deck sheet on the call screen shows what is left, and the steps count tells you which horses the deck favors.')]) +
      sec('Calling the order', [T('Choose a horse for each place you want to back, then size each stake with the + and − buttons (chips: {c}). Every cell on the board is the book’s chance and its price: the odds are that chance minus the book’s cut of about {cut}%, so safe picks pay little and long shots pay a lot.', { c: chips, cut: Math.round((1 - C.edge) * 100) }), T('Back all four places and get them all right and a <b>perfect order</b> bonus is paid on top: the longer the shot, the bigger it is. <b>Back the board’s favorite</b> fills one empty place with the biggest favorite on the board. The rest is up to you.')]) +
      sec('The book’s quirk', [T('The book does not read the deck perfectly, and every race it tells you how it errs. <b>Counts cards, not steps:</b> it underrates suits with extra face cards. <b>Loves a favorite:</b> favorites are priced too short and long shots too fat. <b>Shrugs at the middle:</b> 2nd and 3rd are priced too evenly. Now and then it is <b>a sharp book</b> and makes no mistakes. The deck sheet shows the truth, so compare it with the board and back the cells the book gets wrong.')]) +
      sec('Head to head', [T('Every race the book also offers three duels: which of two horses finishes ahead. Pick one side of any duel you like and stake it as usual. Duels are priced by the same book, quirk and all, and are decided by the final order. They do not count towards a perfect order.')]) +
      sec('Locking and re-calls', [T('Lock your slip before the first card: the stakes are paid and the odds are fixed. You can still change a pick while the race runs, but every re-call costs {f}% of that slip’s stake and is priced at the odds of that moment. A place that is already decided cannot be changed.', { f: Math.round(C.recallFee * 100) })]) +
      sec('Tools', [T('Between cards you can spend cash on tools that bend the deck or the track. Every tool has a price, a limit per race and a Heat cost. More tools unlock in Reputation.'), tools]) +
      sec('Heat and the stewards', [T('Every trick adds Heat. It cools a little with every card drawn clean and between races. From {w} Heat each trick can bring a steward inspection: a fine, and the tool is taken away. At {c} Heat you are caught: that race’s slip is void and you are fined. Tools that only look add no Heat.', { w: C.warnHeat, c: C.heatMax })]) +
      sec('The backroom', [T('After every race you visit the backroom. Buy one <b>favor</b> from the offers (it lasts the whole night: cheaper tools, faster cooling, better odds and more), pay {p} to cool off by {a} Heat, or take a loan of {l} that you repay with {o} at the end of the night (two loans at most).', { p: money(C.coolPrice), a: C.coolAmt, l: money(C.loan), o: money(C.loanOwe) })]) +
      sec('Reputation', [T('When the night ends you earn Reputation Points: for your profit, for every place you called right, and a big bonus for each perfect order. Sharp calls, long shots that land, pay extra too. Spend them in the Reputation tree on new tools, more chips, a bigger bankroll, cooler nerves and a sharper eye on the book. Nothing in it is lost between nights.')]) +
      sec('Walking out and coming back', [T('Between races, before you lock a slip, you can walk out and keep what you have. The night is saved after every move: close the page and press Continue night on the menu.')]);
  }
  buildRules();

  onEnter.menu();
  Sfx.music.mode('chill');
  window.__ui = { go: go, onEnter: onEnter, money: money, ord: ord, horseSVG: horseSVG, guideOnce: guideOnce };
})();

</script>
<script>
/* Gambler's Night UI. Screens: setup, the book (call the order), the race (card by card), the backroom, night over, Reputation. */
(function () {
  'use strict';
  var G = Gamble, GM = G.Meta, U = window.__ui, I = I18n, T = I.t, TP = I.tp, CFG = G.CFG;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var money = U.money, ord = U.ord, go = U.go, onEnter = U.onEnter;

  var GS = { meta: GM.load(), run: null, len: 5, tool: null, recall: null, auto: 0, timer: null, log: [], prevP: null, last: null, tree: { sel: null, seen: null }, recorded: false, doneShown: false, resetArm: 0 };
  var KEY = 'suitderby.grun', SV = 1;

  /* ---------- save and resume ---------- */
  function saveRun() {
    var R = GS.run; if (!R || R.phase === 'over') return;
    try { localStorage.setItem(KEY, JSON.stringify({ v: SV, run: G.pack(R), len: GS.len, log: GS.log.slice(-8) })); } catch (e) {}
  }
  function clearRun() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function loadRun() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.v === SV && d.run && d.run.race && d.run.phase !== 'over') return d; } catch (e) {}
    return null;
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveRun(); });
  window.addEventListener('pagehide', saveRun);

  /* ---------- small helpers ---------- */
  function sn(i) { return T(G.SUITS[i].name); }
  function gl(i) { return '<span class="g s' + i + '">' + G.SUITS[i].glyph + '</span>'; }
  function lab(c) { var l = G.label(c); return I.lang === 'tr' ? ({ J: 'V', Q: 'K', K: 'P' }[l] || l) : l; }
  function cardHTML(c, cls) { return '<span class="gc s' + c.s + (c.r >= 11 ? ' fc' : '') + (cls ? ' ' + cls : '') + '"><b>' + lab(c) + '</b><i>' + G.SUITS[c.s].glyph + '</i></span>'; }
  function oddsTxt(o) { return '×' + I.n(o.toFixed(2)); }
  function pct(p) { return I.n(Math.round(p * 100)) + '%'; }
  function f1(x) { return I.n(x.toFixed(1)); }
  function toolName(id) { return T(G.TOOLS[id].name); }
  var PLACES = ['1st', '2nd', '3rd', '4th'];
  function placeName(pl) { return ord(pl + 1); }
  function log(text) { GS.log.push(text); if (GS.log.length > 40) GS.log.shift(); }
  function bankHTML(R) {
    return '<div class="cashchip gbank" title="' + T('Your bankroll. What is left at the end of the night is your score.') + '">' + money(R.cash) + (R.debt ? '<small>' + T('owe {m}', { m: money(R.debt) }) + '</small>' : '') + '</div>';
  }
  function heatHTML(R) {
    var cap = G.heatCap(R), h = R.heat, w = Math.min(100, h / cap * 100), warn = CFG.warnHeat / cap * 100;
    var st = h < 3 ? 'Calm' : h < CFG.warnHeat ? 'Warm' : h < cap - 2 ? 'The stewards are watching' : 'Danger';
    var ins = G.inspectChance(R);
    return '<div class="gheat st-' + (h < 3 ? 0 : h < CFG.warnHeat ? 1 : h < cap - 2 ? 2 : 3) + '"><span class="lbl">' + T('Heat') + '</span><div class="hbar" role="img" aria-label="' + T('Heat {h} of {c}', { h: f1(h), c: cap }) + '"><i style="width:' + w.toFixed(1) + '%"></i><u style="left:' + warn.toFixed(1) + '%"></u></div><b class="mono">' + f1(h) + ' / ' + cap + '</b><small>' + T(st) + (ins > 0 ? ' · ' + T('{p} inspection chance', { p: pct(ins) }) : '') + '</small></div>';
  }
  function quit() {
    stopAuto(); saveRun(); go('menu');
  }

  /* ---------- menu hooks ---------- */
  var prevMenu = onEnter.menu;
  onEnter.menu = function () {
    prevMenu();
    $('#menu-rp').textContent = T('Permanent upgrades · {n} RP', { n: GS.meta.sp });
    $('#menu-stats').textContent = GS.meta.nights ? T('{n} nights · best {p}', { n: GS.meta.nights, p: money(GS.meta.best, true) }) : T('No nights yet.');
    var sv = loadRun(), b = $('#gResume'); b.hidden = !sv;
    if (sv) { var r = sv.run; $('#gresume-sub').textContent = T('Race {n} of {m}', { n: r.raceNo, m: r.races }) + ' · ' + money(r.cash) + (r.phase === 'back' || r.phase === 'result' ? ' · ' + T('in the backroom') : ''); }
  };
  $('#gResume').addEventListener('click', function () {
    var sv = loadRun(); if (!sv) return;
    GS.run = G.unpack(sv.run); GS.len = sv.len || 5; GS.log = sv.log || []; GS.tool = null; GS.recall = null; GS.recorded = false; GS.doneShown = !!GS.run.race.done; GS.prevP = null;
    show();
  });

  /* ---------- phase router ---------- */
  function show() {
    var R = GS.run, ph = R.phase;
    go(ph === 'book' ? 'gbook' : ph === 'race' ? 'grace' : ph === 'over' ? 'gover' : 'gback');
  }

  /* ---------- setup ---------- */
  onEnter.gsetup = function () { renderSetup(); U.guideOnce(); };
  function renderSetup() {
    var fx = GM.effects(GS.meta), el = $('#s-gsetup');
    if (GS.len === CFG.nightLong && !fx.longNight) GS.len = CFG.night;
    var sv = loadRun();
    el.innerHTML = '<header class="bar"><button type="button" class="backbtn" data-go="menu">&larr; <span>' + T('Menu') + '</span></button><h2>' + T('Gambler’s Night') + '</h2><div class="cashchip sp">' + T('{n} RP', { n: GS.meta.sp }) + '</div></header>' +
      '<p class="lede">' + T('You are not an owner tonight. You are a gambler with a pocket full of tricks. Call the order all four horses will finish in, then bend the deck and the track your way. Do not get caught.') + '</p>' +
      '<div class="gsteps">' +
      '<div class="gstep"><b>1 · ' + T('Read') + '</b><p>' + T('Study the deck sheet and the board. The book prices every race from a flawed view of the deck, and it tells you which flaw. Beat it.') + '</p></div>' +
      '<div class="gstep"><b>2 · ' + T('Call') + '</b><p>' + T('Pick a horse for each place and size each stake, add a head-to-head or two, then lock your slip before the first card.') + '</p></div>' +
      '<div class="gstep"><b>3 · ' + T('Rig') + '</b><p>' + T('Cards are time. Between draws, spend cash on tools that nudge the deck or the track.') + '</p></div>' +
      '<div class="gstep"><b>4 · ' + T('Stay clean') + '</b><p>' + T('Every trick adds Heat. Too much and the stewards inspect you, fine you, or throw out your slip.') + '</p></div></div>' +
      '<details class="gtl"><summary>' + T('All tools and Heat') + '</summary><ul>' + G.TOOL_ORDER.map(function (id) {
        var t = G.TOOLS[id], open = fx.tools.indexOf(id) >= 0;
        return '<li' + (open ? '' : ' class="dim"') + '><b>' + (open ? '' : '🔒 ') + toolName(id) + '</b> <span class="mono">' + money(t.cost) + (t.heat ? ' · ' + T('Heat +{h}', { h: t.heat }) : '') + ' · ' + (t.night ? T('once a night') : T('{n} per race', { n: t.uses })) + '</span><br><small>' + T(t.blurb) + '</small></li>';
      }).join('') + '</ul><p class="note">' + T('Heat cools a little with every card drawn without a trick, and between races. From {w} Heat every trick risks a steward inspection: a fine, and the tool is taken away. At {c} Heat you are caught: your slip is void and you are fined.', { w: CFG.warnHeat, c: G.heatCap({ fx: fx }) }) + '</p></details>' +
      '<h3 class="lbl">' + T('Length of the night') + '</h3><div class="pills" role="radiogroup" aria-label="' + T('Length of the night') + '">' +
      [CFG.night, CFG.nightLong].map(function (n) {
        var lock = n === CFG.nightLong && !fx.longNight;
        return '<label class="pill"><input type="radio" name="glen" value="' + n + '"' + (n === GS.len ? ' checked' : '') + (lock ? ' disabled' : '') + '><b>' + TP(n, '{n} race', '{n} races') + '</b><span>' + (lock ? T('Unlock “Long Night” in Reputation') : n === CFG.night ? T('A short night') : T('A long night')) + '</span></label>';
      }).join('') + '</div>' +
      '<p class="note">' + T('You start with {m}. What you hold at the end of the night, minus any debt, is your score, and it earns Reputation Points (RP).', { m: money(fx.startCash) }) + '</p>' +
      (sv ? '<p class="note warn">' + T('Starting a new night replaces your saved night.') + '</p>' : '') +
      '<div class="actions"><button type="button" class="btn primary" id="gStart">' + T('Start the night') + '</button><button type="button" class="btn" data-go="grep">' + T('Reputation') + '</button></div>';
  }
  $('#s-gsetup').addEventListener('change', function (e) { if (e.target.name === 'glen') GS.len = +e.target.value; });
  $('#s-gsetup').addEventListener('click', function (e) {
    if (!e.target.closest('#gStart')) return;
    Sfx.click(); startNight();
  });
  function startNight() {
    stopAuto();
    GS.run = G.newNight({ meta: GM.effects(GS.meta), races: GS.len });
    GS.log = []; GS.tool = null; GS.recall = null; GS.recorded = false; GS.doneShown = false; GS.prevP = null; GS.last = null;
    saveRun(); show();
  }

  /* ---------- the book: read the deck, call the order ---------- */
  onEnter.gbook = renderBook;
  function deckSheet(R) {
    var r = R.race;
    return r.comp.map(function (c, s) {
      var steps = c.n + c.f * 2;
      return '<div class="dsr s' + s + '"><span class="dsn">' + gl(s) + ' <b>' + sn(s) + '</b></span><span class="dsc">' + T('{n} plain', { n: c.n }) + ' · ' + T('{n} face', { n: c.f }) + '</span><span class="dss mono">' + TP(steps, '{n} step in the deck', '{n} steps in the deck') + '</span><i class="dsbar" style="--w:' + Math.round(steps / 15 * 100) + '%"></i></div>';
    }).join('');
  }
  function topHTML(R) {
    var r = R.race;
    if (!r.pk || !r.deck.length) return '';
    return '<div class="gtop"><span class="lbl">' + T('Top of the deck') + '</span>' + r.deck.slice(0, r.pk).map(function (c) { return cardHTML(c); }).join('') + '</div>';
  }
  function quirkHTML(r) {
    var id = G.quirkOf(r), q = G.QUIRKS[id];
    return '<div class="gqk q-' + id + '"><span class="lbl">' + T('Tonight’s book') + '</span><b>' + T(q.name) + '</b><p>' + T(q.blurb) + '</p></div>';
  }
  /* Bookie's Tell: a mark where the book's price is off. Level 2 also shows by how many points. */
  function tellHTML(R, c) {
    var m = G.tellMark(R, c); if (!m) return '';
    var pts = Math.round(Math.abs(c.d) * 100);
    return '<i class="gtell ' + (m > 0 ? 'up' : 'dn') + '" title="' + T(m > 0 ? 'The book undersells this.' : 'The book oversells this.') + '">' + (m > 0 ? '▲' : '▼') + (R.fx.tell > 1 ? pts : '') + '</i>';
  }
  function pickLines(R) {
    var r = R.race, du = G.duelsOf(R), html = '';
    function line(kind, idx, label, odds, stake) {
      return '<div class="gpick"><span class="gpn">' + label + '</span><span class="mono dim">' + oddsTxt(odds) + '</span><span class="gps"><button type="button" class="gpb" data-gstep="' + kind + ',' + idx + ',-1" aria-label="' + T('Smaller stake') + '"' + (stake <= R.fx.chips[0] ? ' disabled' : '') + '>−</button><b class="mono">' + money(stake) + '</b><button type="button" class="gpb" data-gstep="' + kind + ',' + idx + ',1" aria-label="' + T('Bigger stake') + '"' + (stake >= R.fx.chips[R.fx.chips.length - 1] ? ' disabled' : '') + '>+</button></span></div>';
    }
    var b = G.board(R), db = r.dbets.some(Boolean) ? G.duelBoard(R) : [];
    r.slip.forEach(function (s, pl) { if (s) html += line('p', pl, '<b class="mono">' + placeName(pl) + '</b>' + gl(s.h) + ' ' + sn(s.h), b[s.h][pl].odds, s.stake); });
    r.dbets.forEach(function (d, i) { if (d && du[i]) { var row = db[i], over = du[i][0] === d.h ? du[i][1] : du[i][0]; html += line('d', i, gl(d.h) + ' ' + T('{s} ahead of {o}', { s: sn(d.h), o: sn(over) }), d.h === row.a ? row.oa : row.ob, d.stake); } });
    return html ? '<div class="gpicks">' + html + '</div>' : '';
  }
  function duelsHTML(R) {
    var r = R.race, rows = G.duelBoard(R);
    return '<h3 class="lbl gduh">' + T('Head to head') + '</h3><div class="gduels">' + rows.map(function (d, i) {
      var cur = r.dbets[i];
      function btn(h, other, o, p, t) {
        var on = cur && cur.h === h, c = { d: t - p };
        return '<button type="button" class="gcell gdbtn s' + h + (on ? ' on' : '') + '" data-gduel="' + i + ',' + h + '" aria-pressed="' + on + '">' + '<span class="gdn">' + gl(h) + ' ' + T('{s} ahead', { s: sn(h) }) + '</span><b class="mono">' + oddsTxt(o) + '</b><small class="mono">' + pct(p) + '</small>' + tellHTML(R, c) + '</button>';
      }
      return '<div class="gduel">' + btn(d.a, d.b, d.oa, d.pa, d.ta) + '<span class="gvs mono">' + T('vs') + '</span>' + btn(d.b, d.a, d.ob, d.pb, d.tb) + '</div>';
    }).join('') + '</div>';
  }
  function renderBook() {
    var R = GS.run; if (!R) return; var r = R.race, el = $('#s-gbook'), b = G.board(R), n = r.slip.filter(Boolean).length, nd = r.dbets.filter(Boolean).length;
    var full = n === 4, order = full ? r.slip.map(function (s) { return s.h; }) : null;
    var placeTotal = r.slip.reduce(function (a, s) { return a + (s ? s.stake : 0); }, 0), total = G.staked(R);
    var pm = full ? G.perfectMult(R, order) : 0, pc = full ? G.orderChance(R, order) : 0;
    var rows = '<div class="gboard" role="group" aria-label="' + T('Call the order') + '"><span class="gb-h"></span>' + [0, 1, 2, 3].map(function (pl) { return '<span class="gb-h mono">' + placeName(pl) + '</span>'; }).join('');
    for (var h = 0; h < 4; h++) {
      rows += '<span class="gb-n s' + h + '">' + gl(h) + ' ' + sn(h) + '</span>';
      for (var pl = 0; pl < 4; pl++) {
        var on = r.slip[pl] && r.slip[pl].h === h, c = b[h][pl];
        rows += '<button type="button" class="gcell s' + h + (on ? ' on' : '') + '" data-gcell="' + pl + ',' + h + '" aria-pressed="' + on + '"><b class="mono">' + oddsTxt(c.odds) + '</b><small class="mono">' + pct(c.p) + '</small>' + tellHTML(R, c) + '</button>';
      }
    }
    rows += '</div>';
    var chips = R.fx.chips.map(function (v) { return '<button type="button" class="gchip' + (R.chip === v ? ' on' : '') + '" data-gchip="' + v + '"' + (v > R.cash ? ' disabled' : '') + '>' + money(v) + '</button>'; }).join('');
    var pk = G.toolState(R, 'peek');
    el.innerHTML = '<header class="bar gbar"><button type="button" class="backbtn" data-gquit>&larr; <span>' + T('Menu') + '</span></button><h2>' + T('Race {n} of {m}', { n: R.raceNo, m: R.races }) + '</h2>' + bankHTML(R) + '</header>' +
      heatHTML(R) +
      '<div class="gcols"><div><h3 class="lbl">' + T('The deck') + '</h3><div class="dsheet">' + deckSheet(R) + '</div>' +
      '<p class="note">' + T('First to {n} steps crosses the line. A plain card moves its horse 1 step, a face card 2. The race ends when 3 horses have crossed. The order of the cards is the only secret.', { n: CFG.track }) + '</p>' +
      '<p class="note">' + T('The board is the book’s opinion. The deck sheet is the truth. Compare them.') + '</p>' + topHTML(R) + '</div>' +
      '<div>' + quirkHTML(r) + '<h3 class="lbl">' + T('Call the order') + '</h3>' + rows + duelsHTML(R) +
      '<div class="gslipbar"><span class="lbl">' + T('Stake for every pick') + '</span><div class="gchips">' + chips + '</div></div>' + pickLines(R) +
      '<p class="gsum">' + (n + nd ? T('{n} bets · {m} at stake', { n: n + nd, m: money(total) }) : T('Pick a horse for each place you want to back. A horse can hold one place.')) +
      (total > R.cash ? '<br><span class="neg">' + T('Not enough cash for that. Pick a smaller chip or back fewer places.') + '</span>' : '') +
      (full ? '<br><span class="gold">' + T('Perfect order: {c} chance, pays {m} extra', { c: pc < 0.01 ? '&lt;1%' : pct(pc), m: money(Math.round(placeTotal * pm)) }) + '</span>' : '') + '</p>' +
      '<div class="actions gact"><button type="button" class="btn" data-gbest' + (n === 4 ? ' disabled' : '') + '>' + T('Back the board’s favorite') + '</button>' +
      '<button type="button" class="btn" data-gtool="peek"' + (pk.ok ? '' : ' disabled') + '>' + T('Peek · {m}', { m: money(pk.cost) }) + ' <small>' + pk.left + '/' + pk.max + '</small></button>' +
      '<button type="button" class="btn primary" data-glock' + (G.canLock(R) ? '' : ' disabled') + '>' + T('Lock in your call') + '</button></div>' +
      '<p class="note">' + T('Odds lock when you do. After that you can still change a pick, for a fee, at the odds of that moment.') + '</p>' +
      (R.cash < R.fx.chips[0] ? '<div class="gbanner bad">' + T('You are broke: not enough for even the smallest chip. Borrow in the backroom next time, or walk out now.') + '</div>' : '') +
      '<div class="actions"><button type="button" class="btn ghost small" data-gwalk>' + T('Walk out with {m}', { m: money(R.cash - R.debt) }) + '</button></div></div></div>';
  }
  $('#s-gbook').addEventListener('click', function (e) {
    var R = GS.run; if (!R) return; var t = e.target;
    var c = t.closest('[data-gcell]');
    if (c) { var p = c.dataset.gcell.split(','); if (G.pick(R, +p[0], +p[1])) { Sfx.pick(); saveRun(); renderBook(); } return; }
    c = t.closest('[data-gduel]'); if (c) { var d = c.dataset.gduel.split(','); if (G.duelPick(R, +d[0], +d[1])) { Sfx.pick(); saveRun(); renderBook(); } return; }
    c = t.closest('[data-gstep]'); if (c) { var q = c.dataset.gstep.split(','); if (G.stepStake(R, q[0], +q[1], +q[2])) { Sfx.chip(); saveRun(); renderBook(); } else Sfx.deny(); return; }
    c = t.closest('[data-gchip]'); if (c) { if (G.setChip(R, +c.dataset.gchip)) { Sfx.chip(); saveRun(); renderBook(); } return; }
    if (t.closest('[data-gbest]')) { if (G.pickFavorite(R)) { Sfx.pick(); saveRun(); renderBook(); } else Sfx.deny(); return; }
    c = t.closest('[data-gtool]'); if (c) { runTool(c.dataset.gtool); return; }
    if (t.closest('[data-glock]')) {
      if (G.lock(R)) { Sfx.chip(); GS.last = null; GS.prevP = null; GS.doneShown = false; GS.auto = 0; log(T('Slip locked. The race is on.')); saveRun(); show(); } else Sfx.deny();
      return;
    }
    if (t.closest('[data-gwalk]')) { if (G.walkOut(R)) { saveRun(); overHook(); show(); } return; }
    if (t.closest('[data-gquit]')) quit();
  });

  /* ---------- the race ---------- */
  onEnter.grace = function () { buildRace(); renderRace(); updateLanes(true); };
  function buildRace() {
    var el = $('#s-grace');
    el.innerHTML = '<header class="bar gbar"><button type="button" class="backbtn" data-gquit>&larr; <span>' + T('Menu') + '</span></button><h2 id="gr-title"></h2><div id="gr-bank"></div></header>' +
      '<div id="gr-heat"></div>' +
      '<div class="glanes" id="glanes">' + [0, 1, 2, 3].map(function (i) {

        '<h3 class="lbl sect-h">' + T('Services') + '</h3><div class="offers">' +
        '<div class="offer"><span class="kindlbl">' + T('Service') + '</span><h4>' + T('Cool off') + '</h4><p>' + T('Slip out for a while. Heat drops by {n}.', { n: CFG.coolAmt }) + '</p><div class="offer-foot"><b class="mono gold">' + money(CFG.coolPrice) + '</b><button type="button" class="btn small" data-gcool' + (R.heat > 0 && R.cash >= CFG.coolPrice ? '' : ' disabled') + '>' + T('Cool off') + '</button></div></div>' +
        '<div class="offer"><span class="kindlbl">' + T('Service') + '</span><h4>' + T('Loan shark') + '</h4><p>' + T('Borrow {a} now, owe {o} when the night ends. Twice a night at most.', { a: money(CFG.loan), o: money(R.fx.loanOwe) }) + '</p><div class="offer-foot"><b class="mono gold">' + T('owe {m}', { m: money(R.fx.loanOwe) }) + '</b><button type="button" class="btn small" data-gloan' + (G.canLoan(R) ? '' : ' disabled') + '>' + T('Borrow') + '</button></div></div></div>' +
        (R.favors.length ? '<p class="note">' + T('Your favors:') + ' ' + R.favors.map(function (id) { return T(G.favorById(id).name); }).join(', ') + '</p>' : '') +
        heatHTML(R) +
        '<div class="actions"><button type="button" class="btn primary" data-gnext>' + T('Start race {n}', { n: R.raceNo + 1 }) + '</button></div>';
    }
    el.innerHTML = html;
  }
  $('#s-gback').addEventListener('click', function (e) {
    var R = GS.run; if (!R) return; var t = e.target, c;
    if (t.closest('[data-gquit]')) { quit(); return; }
    if (t.closest('[data-gnext]')) {
      if (R.phase === 'result') { G.toBackroom(R); saveRun(); if (R.phase === 'over') { overHook(); } show(); }
      else if (R.phase === 'back') { G.nextRace(R); GS.log = []; GS.last = null; GS.prevP = null; GS.doneShown = false; saveRun(); show(); }
      return;
    }
    c = t.closest('[data-gfavor]'); if (c) { if (G.buyFavor(R, c.dataset.gfavor)) { Sfx.buy(); saveRun(); renderBack(); } else Sfx.deny(); return; }
    if (t.closest('[data-gcool]')) { if (G.coolOff(R)) { Sfx.buy(); saveRun(); renderBack(); } else Sfx.deny(); return; }
    if (t.closest('[data-gloan]')) { if (G.takeLoan(R)) { Sfx.chip(); saveRun(); renderBack(); } else Sfx.deny(); }
  });

  /* ---------- night over ---------- */
  function overHook() {
    if (GS.recorded) return; GS.recorded = true;
    GM.record(GS.meta, GS.run.over); GM.save(GS.meta); clearRun();
  }
  onEnter.gover = function () {
    var R = GS.run; if (!R) return; overHook(); var o = R.over, el = $('#s-gover');
    el.innerHTML = '<header class="bar"><h2>' + T('Night over') + '</h2><div class="cashchip sp">' + T('{n} RP', { n: GS.meta.sp }) + '</div></header>' +
      '<div class="gover"><div class="gbig ' + (o.profit >= 0 ? 'pos' : 'neg') + '">' + money(o.profit, true) + '</div><p class="lede">' + (o.profit > 0 ? T('You walked out ahead.') : o.profit === 0 ? T('You broke even.') : T('The house had a good night.')) + '</p></div>' +
      '<div class="stmt gstats">' +
      '<div class="row"><span>' + T('Cash at the end') + '</span><b class="mono">' + money(R.cash) + '</b></div>' +
      (R.debt ? '<div class="row"><span>' + T('Debt repaid') + '</span><b class="mono neg">−' + money(R.debt) + '</b></div>' : '') +
      '<div class="row"><span>' + T('Final bankroll') + '</span><b class="mono gold">' + money(o.final) + '</b></div>' +
      '<div class="row"><span>' + T('Places called right') + '</span><b class="mono">' + o.hits + ' / ' + (R.stats.races * 4) + '</b></div>' +
      '<div class="row"><span>' + T('Perfect orders') + '</span><b class="mono">' + o.perfects + '</b></div>' +
      '<div class="row"><span>' + T('Sharp calls (long shots that landed)') + '</span><b class="mono">' + (o.sharp || 0) + '</b></div>' +
      '<div class="row"><span>' + T('Tools used') + '</span><b class="mono">' + R.stats.tools + '</b></div>' +
      '<div class="row"><span>' + T('Times caught · inspections') + '</span><b class="mono">' + o.caught + ' · ' + R.stats.inspections + '</b></div>' +
      '<div class="row total"><span>' + T('Reputation earned') + '</span><b class="mono gold">+' + o.rp + ' RP</b></div></div>' +
      '<div class="actions"><button type="button" class="btn primary" data-go="gsetup">' + T('Another night') + '</button><button type="button" class="btn" data-go="grep">' + T('Reputation') + '</button><button type="button" class="btn ghost" data-go="menu">' + T('Menu') + '</button></div>';
    if (o.profit > 0) { Sfx.champion(); FX.confetti(innerWidth / 2, innerHeight * 0.3, 80); }
  };

  /* ---------- Reputation: the skill tree ---------- */
  var ICONS = { t_swap: '🔀', t_wind: '💨', t_shave: '🪒', t_hurdle: '🚧', t_riffle: '🂠', t_lane: '🌀', t_belt: '🧰', n_cool: '🧊', n_skin: '🦏', n_watch: '👀', n_law: '⚖️', n_palm: '🤝', n_alibi: '🕵️', p_deep: '👛', p_chips: '🎰', p_haggle: '🏷️', p_night: '🌙', p_shark: '🦈', p_safe: '🛟', e_sharp: '🎯', e_view: '🔭', e_perf: '🏆', e_net: '📇', e_calls: '☎️', e_tip: '💡', e_tell: '👁️' };
  var NS = 'http://www.w3.org/2000/svg';
  function npos(n) { var a = n.a * Math.PI / 180, r = [0, 135, 245, 345, 440][n.r]; return { x: 500 + r * Math.cos(a), y: 500 + r * Math.sin(a) }; }
  function brOf(n) { return GM.BRANCHES.filter(function (b) { return b.id === n.br; })[0]; }
  function nstate(n) {
    var st = GS.meta;
    if (GM.owned(st, n.id) && GM.costOf(st, n.id) == null) return 'max';
    if (GM.owned(st, n.id)) return 'own';
    if (!GM.isOpen(st, n.id)) return 'locked';
    return GM.canBuy(st, n.id) ? 'aff' : 'open';
  }
  onEnter.grep = function () {
    $('#s-grep').innerHTML = '<header class="bar"><button type="button" class="backbtn" data-go="gsetup">&larr; <span>' + T('Back') + '</span></button><h2>' + T('Reputation') + '</h2><div class="cashchip sp" id="grp-sp"></div></header>' +
      '<p class="lede sm">' + T('Reputation Points come from your nights. Spend them on a skill tree that grows as you buy: new tools, a cooler head, a fatter bankroll, a better book.') + '</p>' +
      '<div class="treewrap" id="gtreewrap"><svg id="gtree" viewBox="0 0 1000 1000" role="group" aria-label="' + T('Skill tree') + '"></svg></div><div class="nodeinfo" id="gnodeinfo"></div>' +
      '<div class="actions"><button type="button" class="btn ghost small" id="gReset"></button></div>';
    GS.tree.seen = null; renderRep();
    var w = $('#gtreewrap'); w.scrollLeft = (w.scrollWidth - w.clientWidth) / 2; w.scrollTop = (w.scrollHeight - w.clientHeight) / 2;
  };
  function renderRep() {
    var st = GS.meta, html = '', seen2 = {};
    $('#grp-sp').textContent = T('{n} RP', { n: st.sp });
    [135, 245, 345, 440].forEach(function (r) { html += '<circle class="ring" cx="500" cy="500" r="' + r + '"/>'; });
    var vis = function (n) { return GM.owned(st, n.id) || GM.isOpen(st, n.id); };
    GM.NODES.forEach(function (n) {
      if (!vis(n)) return; var p = npos(n);
      n.parents.forEach(function (pid) {
        var pp = pid === 'root' ? { x: 500, y: 500 } : npos(GM.nodeById(pid));
        if (pid !== 'root' && !vis(GM.nodeById(pid))) return;
        html += '<line class="edge' + (GM.owned(st, n.id) && GM.owned(st, pid) ? ' on' : '') + '" x1="' + pp.x.toFixed(1) + '" y1="' + pp.y.toFixed(1) + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" style="--c:' + brOf(n).color + '"/>';
      });
    });
    html += '<g class="nd root" transform="translate(500 500)"><circle r="40"/><text class="ic" y="10" text-anchor="middle">🃏</text></g>';
    GM.NODES.forEach(function (n) {
      if (!vis(n)) return;
      var p = npos(n), s = nstate(n), lv = GM.level(st, n.id), mx = GM.maxOf(n), pips = '';
      if (mx > 1) for (var k = 0; k < mx; k++) pips += '<circle class="pip' + (k < lv ? ' on' : '') + '" cx="' + ((k - (mx - 1) / 2) * 9).toFixed(1) + '" cy="35" r="3"/>';
      var fresh = GS.tree.seen && !GS.tree.seen[n.id]; seen2[n.id] = 1;
      html += '<g class="nd st-' + s + (fresh ? ' new' : '') + (GS.tree.sel === n.id ? ' sel' : '') + '" data-gnode="' + n.id + '" transform="translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')" style="--c:' + brOf(n).color + '" tabindex="0" role="button" aria-label="' + T(n.name) + '"><circle r="26"/><text class="ic" y="9" text-anchor="middle">' + (ICONS[n.id] || '•') + '</text>' + pips + '</g>';
    });
    $('#gtree').innerHTML = html; GS.tree.seen = seen2;
    var box = $('#gnodeinfo'), n = GS.tree.sel ? GM.nodeById(GS.tree.sel) : null;
    if (!n || n.id === 'root') {
      box.innerHTML = '<p class="note" style="margin:0">' + T('Tap a node to see what it does. You start in the middle and the tree grows as you buy: new nodes appear next to the ones you own.') + '</p><div class="legend">' + GM.BRANCHES.map(function (b) { return '<span style="--c:' + b.color + '"><i></i>' + T(b.name) + '</span>'; }).join('') + '</div>';
    } else {
      var s2 = nstate(n), lv2 = GM.level(st, n.id), mx2 = GM.maxOf(n), cost = GM.costOf(st, n.id), br = brOf(n), pp = '';
      for (var q = 0; q < mx2; q++) pp += '<i class="' + (q < lv2 ? 'on' : '') + '"></i>';
      var btn = s2 === 'max' ? '<button type="button" class="btn small" disabled>' + T('Maxed') + '</button>' : s2 === 'locked' ? '<button type="button" class="btn small" disabled>' + T('Open a neighbouring node first') + '</button>' : '<button type="button" class="btn small primary" data-gbuy="' + n.id + '"' + (s2 === 'aff' ? '' : ' disabled') + '>' + T('Buy · {c} RP', { c: cost }) + '</button>';
      box.innerHTML = '<div class="ni"><span class="nic" aria-hidden="true">' + (ICONS[n.id] || '•') + '</span><div class="nt"><h4>' + T(n.name) + '</h4><span class="nb" style="--c:' + br.color + '">' + T(br.name) + '</span></div></div><p>' + T(n.blurb) + '</p><div class="row"><div class="pips" aria-hidden="true">' + pp + '</div><span class="lv">' + (mx2 > 1 ? T('Level {n} / {m}', { n: lv2, m: mx2 }) : (lv2 ? T('Owned') : T('Not owned'))) + '</span>' + btn + '</div>';
    }
    $('#gReset').textContent = GS.resetArm ? T('Really reset everything?') : T('Reset Reputation');
  }
  $('#s-grep').addEventListener('click', function (e) {
    var g = e.target.closest('[data-gnode]');
    if (g) { GS.tree.sel = g.dataset.gnode; Sfx.pick(); renderRep(); return; }
    var b = e.target.closest('[data-gbuy]');
    if (b) { if (GM.buy(GS.meta, b.dataset.gbuy)) { GM.save(GS.meta); Sfx.buy(); renderRep(); } else Sfx.deny(); return; }
    if (e.target.closest('#gReset')) {
      if (!GS.resetArm) { GS.resetArm = 1; renderRep(); setTimeout(function () { GS.resetArm = 0; if (GS_screen() === 'grep') renderRep(); }, 4000); return; }
      GS.resetArm = 0; GS.meta = GM.reset(); GS.tree.sel = null; renderRep();
    }
  });
  $('#s-grep').addEventListener('keydown', function (e) { if (e.code === 'Enter' || e.code === 'Space') { var g = e.target.closest('[data-gnode]'); if (g) { e.preventDefault(); GS.tree.sel = g.dataset.gnode; Sfx.pick(); renderRep(); } } });

  /* language switch: rebuild whatever is on screen */
  I.onChange(function () {
    var s = GS_screen();
    if (s === 'gsetup') renderSetup(); else if (s === 'gbook') renderBook(); else if (s === 'grace') { buildRace(); renderRace(); updateLanes(true); } else if (s === 'gback') renderBack(); else if (s === 'gover') onEnter.gover(); else if (s === 'grep') renderRepAll();
  });
  function renderRepAll() { onEnter.grep(); }
  window.__gamble = { GS: GS, G: G, show: show, doDraw: doDraw };
  onEnter.menu();   // the menu was drawn before this file loaded: draw it again so the Continue button shows up
})();

</script>
