<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0d110c">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suit Derby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- MENU -->
  <section class="screen" id="s-menu" aria-label="Menu">
    <div class="langrow"><button type="button" class="sndbtn" id="sndMenu" data-snd="fx"></button><button type="button" class="sndbtn" id="musMenu" data-snd="music"></button><span class="langlbl mono" data-i18n="Language">Language</span><div class="langsw" id="langsw" role="group" data-i18n-label="Language" aria-label="Language"></div></div>
    <div class="menu-hero">
      <h1>Suit Derby</h1>
      <p class="lede" data-i18n="Four suits race through one deck. Call the order, rig the race, keep your nerve.">Four suits race through one deck. Call the order, rig the race, keep your nerve.</p>
    </div>
    <div class="lineup" id="lineup" aria-hidden="true"></div>
    <nav class="menu-list" data-i18n-label="Main menu" aria-label="Main menu">
      <button type="button" class="mrow gnight resume" id="gResume" hidden><span class="mt" data-i18n="Continue night">Continue night</span><span class="md" id="gresume-sub"></span></button>
      <button type="button" class="mrow primary" data-go="gsetup"><span class="mt" data-i18n="Gambler’s Night">Gambler’s Night</span><span class="md" id="gnight-sub" data-i18n="Call the finishing order, rig the race, don’t get caught.">Call the finishing order, rig the race, don’t get caught.</span></button>
      <button type="button" class="mrow" data-go="grep"><span class="mt" data-i18n="Reputation">Reputation</span><span class="md" id="menu-rp"></span></button>
      <button type="button" class="mrow" data-go="rules"><span class="mt" data-i18n="Rules">Rules</span><span class="md" data-i18n="How a night works">How a night works</span></button>
    </nav>
    <p class="mstats mono" id="menu-stats"></p>
  </section>

  <!-- GAMBLER'S NIGHT -->
  <section class="screen" id="s-gsetup" hidden aria-label="Gambler’s Night"></section>
  <section class="screen" id="s-gbook" hidden aria-label="The book"></section>
  <section class="screen" id="s-grace" hidden aria-label="The race"></section>
  <section class="screen" id="s-gback" hidden aria-label="Result and backroom"></section>
  <section class="screen" id="s-gover" hidden aria-label="Night over"></section>
  <section class="screen" id="s-grep" hidden aria-label="Reputation"></section>

  <!-- RULES -->
  <section class="screen" id="s-rules" hidden aria-label="Rules">
    <header class="bar"><button type="button" class="backbtn" data-go="menu">&larr; <span data-i18n="Menu">Menu</span></button><h2 data-i18n="Rules">Rules</h2></header>
    <div class="actions top"><button type="button" class="btn small" id="openGuide" data-i18n="How to play">How to play</button></div>
    <div class="rules" id="rules"></div>
  </section>

</div>
<div class="modal" id="guide" hidden role="dialog" aria-modal="true" data-i18n-label="How to play" aria-label="How to play">
  <div class="mcard">
    <div class="mdots" id="gdots" aria-hidden="true"></div>
    <div id="gbody"></div>
    <div class="mnav"><button type="button" class="btn ghost small" id="gskip" data-i18n="Skip">Skip</button><button type="button" class="btn primary small" id="gnext" data-i18n="Next">Next</button></div>
  </div>
</div>
<div id="flashfx" aria-hidden="true"></div>
<div class="bigwin" id="bigwin" hidden aria-live="polite"><div class="bw-rays"></div><div class="bw-t" data-i18n="BIG WIN">BIG WIN</div><div class="bw-a mono"></div></div>
<script src="i18n.js"></script>
<script src="lang_tr.js"></script>
<script src="audio.js"></script>
<script src="gamble.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
<script src="gamble_ui.js"></script>
</body>
</html>
